[workspace]
resolver = "3"
members = ["crates/core", "crates/facade", "crates/integrations/*", "crates/testkit"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/0xteamhq/socket"

[workspace.dependencies]
socketkit-core = { path = "crates/core", version = "0.0.0" }
socketkit-testkit = { path = "crates/testkit", version = "0.0.0" }
socketkit-github = { path = "crates/integrations/github", version = "0.0.0" }
socketkit-slack = { path = "crates/integrations/slack", version = "0.0.0" }
socketkit-linear = { path = "crates/integrations/linear", version = "0.0.0" }
socketkit-notion = { path = "crates/integrations/notion", version = "0.0.0" }
socketkit-google = { path = "crates/integrations/google", version = "0.0.0" }
socketkit-zoom = { path = "crates/integrations/zoom", version = "0.0.0" }
async-trait = "0.1"
base64 = "0.22"
getrandom = "0.3"
hmac = "0.12"
schemars = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
tokio = { version = "1", features = ["sync", "time"] }
wiremock = "0.6"
url = { version = "2", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
