name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --workspace --all-features
      - run: cargo run -p socketkit-core --example invoke_by_name
      - run: cargo run -p socketkit --all-features --example catalogue

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      # Library crates only: the test kit's mock server needs a newer Rust than the libraries do.
      - run: cargo check --workspace --exclude socketkit-testkit --all-features
